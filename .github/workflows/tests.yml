name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile and run tests
        env:
          CC: ${{ matrix.compiler }}
          NO_COLOR: "1"
        run: make test

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run sanitizers
        env:
          NO_COLOR: "1"
        run: make test-sanitize
